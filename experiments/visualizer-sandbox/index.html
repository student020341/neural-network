<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Visualizer Sandbox & Stress Workbench</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #090d13;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(22, 27, 34, 0.9);
            border-bottom: 1px solid #30363d;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 {
            font-size: 16px;
            font-weight: 600;
            color: #58a6ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .controls-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }
        .panel-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel-title {
            font-size: 13px;
            font-weight: 600;
            color: #79c0ff;
            border-bottom: 1px solid #21262d;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        button:hover {
            background: #30363d;
            border-color: #58a6ff;
            color: #fff;
        }
        button.active-btn {
            background: #1f6feb33;
            border-color: #1f6feb;
            color: #58a6ff;
        }
        .btn-danger:hover {
            background: #da363322;
            border-color: #f85149;
            color: #f85149;
        }
        .field-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #8b949e;
        }
        .field-row label {
            min-width: 90px;
        }
        input[type="text"], select {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            padding: 6px 8px;
            font-size: 12px;
            outline: none;
        }
        input[type="text"]:focus, select:focus {
            border-color: #58a6ff;
        }
        input[type="range"] {
            flex: 1;
            cursor: pointer;
        }
        .badge {
            background: #30363d;
            color: #8b949e;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
        }
        .sliders-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }
        .slider-name {
            width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #79c0ff;
        }
        .slider-val {
            width: 35px;
            text-align: right;
            color: #8b949e;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <header>
        <h1>🔬 Brain Visualizer Sandbox & Stress Workbench</h1>
        <div style="display: flex; gap: 8px;">
            <button id="btn-scramble-all">🎲 Scramble Weights</button>
            <button class="btn-danger" id="btn-clear-all">🧹 Clear All</button>
        </div>
    </header>

    <div class="controls-container">
        <!-- Presets Panel -->
        <div class="panel-card">
            <div class="panel-title">
                <span>⚡ Brain Topology Presets</span>
                <span class="badge">1-Click Spawn</span>
            </div>
            <div class="btn-grid">
                <button id="preset-tiny-dense">🌱 Tiny Dense [3, 2]</button>
                <button id="preset-standard-dense">🧠 Standard [4, 8, 3]</button>
                <button id="preset-deep-dense">🌊 Deep Dense [5, 16, 16, 3]</button>
                <button id="preset-wide-dense">📊 Wide Dense [8, 32, 4]</button>
                <button id="preset-sparse-reflex">🧬 Sparse Direct [4, 2]</button>
                <button id="preset-sparse-loop">↺ Sparse Recurrent Loop</button>
                <button id="preset-sparse-complex">🕸️ Sparse Complex Mesh</button>
                <button id="preset-multi-swarm">👥 Multi-Brain Swarm (4)</button>
            </div>
        </div>

        <!-- Custom Brain Builder -->
        <div class="panel-card">
            <div class="panel-title">
                <span>🛠️ Custom Brain Builder</span>
                <span class="badge">Create & Track</span>
            </div>
            <div class="field-row">
                <label>Label:</label>
                <input type="text" id="custom-name" value="Custom Agent" />
            </div>
            <div class="field-row">
                <label>Network Type:</label>
                <select id="custom-type">
                    <option value="dense">Dense Network</option>
                    <option value="sparse">Sparse Network (NEAT style)</option>
                </select>
            </div>
            <div class="field-row" id="row-dense-layers">
                <label>Layer Sizes:</label>
                <input type="text" id="custom-layers" value="4, 8, 8, 2" placeholder="e.g. 4, 8, 8, 2" />
            </div>
            <div class="field-row" id="row-sparse-nodes" style="display: none;">
                <label>In, Out, Hid:</label>
                <input type="text" id="custom-sparse-config" value="4, 2, 6" placeholder="In, Out, Hidden" />
            </div>
            <button id="btn-add-custom" style="justify-content: center; background: #238636; border-color: #2ea043; color: white;">
                ➕ Instantiate & Track Brain
            </button>
        </div>

        <!-- Input Signal Generator -->
        <div class="panel-card">
            <div class="panel-title">
                <span>📡 Input Signal Driver</span>
                <span class="badge">Live Stimulation</span>
            </div>
            <div class="field-row">
                <label>Signal Pattern:</label>
                <select id="signal-mode">
                    <option value="harmonic">🌊 Harmonic Sine Waves (Smooth)</option>
                    <option value="twitch">⚡ Impulse Twitch / Spikes</option>
                    <option value="noise">🎲 Perlin-style Continuous Noise</option>
                    <option value="manual">🎛️ Manual Interactive Sliders</option>
                </select>
            </div>
            <div class="field-row">
                <label>Signal Rate:</label>
                <input type="range" id="signal-speed" min="0.1" max="4.0" step="0.1" value="1.0" />
                <span id="speed-val" style="width: 30px; font-variant-numeric: tabular-nums;">1.0x</span>
            </div>
            <div id="manual-sliders-container" style="display: none;">
                <div style="font-size: 11px; color: #8b949e; margin-bottom: 6px;">Manual Sensor Controls:</div>
                <div class="sliders-box" id="sliders-box"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../networks/dense_network.js"></script>
    <script src="../../networks/sparse_network.js"></script>
    <script src="../../tools/brain_visualizer.js"></script>
    <script src="sandbox.js"></script>
</body>
</html>
